name: pcwork_mobile
description: PCWork cross-platform mobile application for Android and iOS.
publish_to: none
version: 0.26.0+26
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  signature: ^5.5.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
