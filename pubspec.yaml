name: pcwork_mobile
description: PCWork cross-platform mobile application for Android and iOS.
publish_to: none
version: 0.76.0+76
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  app_settings: ^5.1.1
  path_provider: ^2.1.5
  signature: ^5.5.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  font_awesome_flutter: 11.0.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

# PCWork branded launcher icon (Android/iOS)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/pcwork_app_icon.png
  adaptive_icon_background: "#0A101A"
  adaptive_icon_foreground: assets/images/pcwork_adaptive_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 23

# Branded native launch screen
flutter_native_splash:
  color: "#0A101A"
  image: assets/images/pcwork_splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0A101A"
    image: assets/images/pcwork_splash_logo.png
    icon_background_color: "#0A101A"
