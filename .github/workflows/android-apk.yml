name: PCWork Android ARM64 Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pcwork-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android ARM64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Cache only the pinned SDK components needed by this Android project.
      - name: Cache Android SDK Platform 33 and CMake 3.22.1
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-33
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ${{ runner.os }}-android-sdk-platform33-cmake3221-v1

      - name: Cache Android NDK 28.2.13676358
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ${{ runner.os }}-android-ndk-28.2.13676358-v1

      - name: Generate iOS asset catalog for shared branding assets
        run: flutter create --platforms=ios --org com.pcworkbg --project-name pcwork_mobile .

      - name: Prepare Android project
        run: bash ./scripts/prepare_android.sh

      - name: Verify or install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi
          PLATFORM_DIR="$SDK_ROOT/platforms/android-33"
          CMAKE_DIR="$SDK_ROOT/cmake/3.22.1"
          if [[ ! -s "$PLATFORM_DIR/android.jar" || ! -s "$PLATFORM_DIR/package.xml" ||
                ! -s "$CMAKE_DIR/source.properties" ]]; then
            echo "Installing missing Android SDK Platform 33 and/or CMake 3.22.1."
            LICENSE_INPUT="$(printf 'y\n%.0s' {1..100})"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses <<< "$LICENSE_INPUT" >/dev/null
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-33" "cmake;3.22.1"
          else
            echo "Android SDK Platform 33 and CMake 3.22.1 cache verified."
          fi
          {
            printf 'ANDROID_SDK_ROOT=%s\n' "$SDK_ROOT"
            printf 'ANDROID_HOME=%s\n' "$SDK_ROOT"
          } >> "$GITHUB_ENV"

      - name: Verify or install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          is_valid_ndk() {
            [[ -s "$NDK_DIR/source.properties" && -s "$NDK_DIR/package.xml" && -x "$NDK_DIR/ndk-build" ]] &&
              grep -Fq "Pkg.Revision = $NDK_VERSION" "$NDK_DIR/source.properties"
          }
          if is_valid_ndk; then
            echo "Using cached Android NDK $NDK_VERSION."
          else
            echo "Installing missing or incomplete Android NDK $NDK_VERSION."
            if [[ -d "$NDK_DIR" ]]; then rm -rf "$NDK_DIR"; fi
            LICENSE_INPUT="$(printf 'y\n%.0s' {1..100})"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses <<< "$LICENSE_INPUT" >/dev/null
            installed=false
            for attempt in 1 2 3; do
              echo "NDK installation attempt $attempt/3..."
              if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION" && is_valid_ndk; then
                installed=true
                break
              fi
              rm -rf "$NDK_DIR"
            done
            if [[ "$installed" != true ]]; then
              echo "ERROR: NDK $NDK_VERSION could not be installed and verified."
              exit 1
            fi
          fi
          echo "Android NDK $NDK_VERSION is ready."

      - name: Set up Gradle and restore Gradle caches
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Flutter SDK path for Gradle
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          test -d "$FLUTTER_ROOT/packages/flutter_tools/gradle"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          test -s android/local.properties
          echo "Flutter SDK path configured for Gradle."

      - name: Validate and export app version
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate_version.sh
          PUBSPEC_VERSION="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          PCWORK_BUILD_NUMBER="${PUBSPEC_VERSION##*+}"
          echo "PUBSPEC_VERSION=$PUBSPEC_VERSION" >> "$GITHUB_ENV"
          echo "PCWORK_BUILD_NUMBER=$PCWORK_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Validated PCWork Mobile $PUBSPEC_VERSION."

      - name: Read Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="android/app/google-services.json"
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "ERROR: $CONFIG_FILE is missing. Add the real Firebase Android configuration to the repository."
            exit 1
          fi
          PACKAGE_NAME="com.pcworkbg.pcwork_mobile"
          MATCH_COUNT=$(jq --arg package "$PACKAGE_NAME" '[.client[]? | select(.client_info.android_client_info.package_name == $package)] | length' "$CONFIG_FILE")
          if [[ "$MATCH_COUNT" != "1" ]]; then
            echo "ERROR: google-services.json must contain exactly one Android client for $PACKAGE_NAME."
            exit 1
          fi
          FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id // empty' "$CONFIG_FILE")
          FIREBASE_MESSAGING_SENDER_ID=$(jq -r '.project_info.project_number // empty' "$CONFIG_FILE")
          FIREBASE_ANDROID_APP_ID=$(jq -r --arg package "$PACKAGE_NAME" '.client[] | select(.client_info.android_client_info.package_name == $package) | .client_info.mobilesdk_app_id // empty' "$CONFIG_FILE")
          FIREBASE_ANDROID_API_KEY=$(jq -r --arg package "$PACKAGE_NAME" '.client[] | select(.client_info.android_client_info.package_name == $package) | .api_key[0].current_key // empty' "$CONFIG_FILE")
          if [[ -z "$FIREBASE_PROJECT_ID" || -z "$FIREBASE_MESSAGING_SENDER_ID" || -z "$FIREBASE_ANDROID_APP_ID" || -z "$FIREBASE_ANDROID_API_KEY" ]]; then
            echo "ERROR: google-services.json is missing required Firebase Android fields."
            exit 1
          fi
          {
            printf 'FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID"
            printf 'FIREBASE_MESSAGING_SENDER_ID=%s\n' "$FIREBASE_MESSAGING_SENDER_ID"
            printf 'FIREBASE_ANDROID_APP_ID=%s\n' "$FIREBASE_ANDROID_APP_ID"
            printf 'FIREBASE_ANDROID_API_KEY=%s\n' "$FIREBASE_ANDROID_API_KEY"
          } >> "$GITHUB_ENV"

      - name: Configure persistent release signing
        shell: bash
        env:
          PCWORK_KEYSTORE_BASE64: ${{ secrets.PCWORK_KEYSTORE_BASE64 }}
          PCWORK_KEYSTORE_PASSWORD: ${{ secrets.PCWORK_KEYSTORE_PASSWORD }}
          PCWORK_KEY_ALIAS: ${{ secrets.PCWORK_KEY_ALIAS }}
          PCWORK_KEY_PASSWORD: ${{ secrets.PCWORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${PCWORK_KEYSTORE_BASE64:-}" || -z "${PCWORK_KEYSTORE_PASSWORD:-}" || -z "${PCWORK_KEY_ALIAS:-}" || -z "${PCWORK_KEY_PASSWORD:-}" ]]; then
            echo "ERROR: All four PCWORK release-signing secrets must be configured."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pcwork-signing"
          printf '%s' "$PCWORK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pcwork-signing/pcwork-release.jks"
          chmod 600 "$RUNNER_TEMP/pcwork-signing/pcwork-release.jks"
          {
            printf 'PCWORK_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/pcwork-signing/pcwork-release.jks"
            printf 'PCWORK_KEYSTORE_PASSWORD=%s\n' "$PCWORK_KEYSTORE_PASSWORD"
            printf 'PCWORK_KEY_ALIAS=%s\n' "$PCWORK_KEY_ALIAS"
            printf 'PCWORK_KEY_PASSWORD=%s\n' "$PCWORK_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Resolve dependencies and verify splash plugin metadata
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          SPLASH_VERSION="$(python3 - <<'PYVERSION'
          from pathlib import Path
          lines = Path('pubspec.lock').read_text().splitlines()
          active = False
          for line in lines:
              if line == '  flutter_native_splash:':
                  active = True
                  continue
              if active and line.startswith('  ') and not line.startswith('    '):
                  break
              if active and line.startswith('    version:'):
                  print(line.split(':', 1)[1].strip().strip("\"'"))
                  break
          PYVERSION
          )"
          if [[ "$SPLASH_VERSION" != "2.4.8" ]]; then
            echo "ERROR: expected flutter_native_splash 2.4.8, got ${SPLASH_VERSION:-missing}."
            exit 1
          fi
          python3 - <<'PYMETA'
          import json
          from pathlib import Path
          path = Path('.flutter-plugins-dependencies')
          if not path.is_file():
              raise SystemExit('ERROR: Flutter plugin metadata was not generated.')
          data = json.loads(path.read_text())
          names = [item.get('name', '') for item in data.get('plugins', {}).get('android', [])]
          if 'flutter_native_splash' in names:
              raise SystemExit('ERROR: flutter_native_splash unexpectedly appears in Android plugin metadata.')
          print('Verified: splash generator is not registered as an Android plugin.')
          PYMETA

      - name: Generate PCWork launcher icons and native splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Verify generated Android plugin registrant
        shell: bash
        run: |
          set -euo pipefail
          REGISTRANT="android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"
          if [[ -f "$REGISTRANT" ]] && grep -q 'net.jonhanson.flutter_native_splash' "$REGISTRANT"; then
            echo "Removing stale GeneratedPluginRegistrant.java before Flutter regenerates it."
            rm -f "$REGISTRANT"
          fi

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build single-ABI ARM64 release APK
        run: >-
          flutter build apk --release --target-platform android-arm64 --no-pub
          --dart-define=PCWORK_BUILD_NUMBER="$PCWORK_BUILD_NUMBER"
          --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
          --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY"
          --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - name: Verify ARM64 APK version metadata
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK_ANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -perm -u+x 2>/dev/null | head -n 1)"
          if [[ -z "$APK_ANALYZER" ]]; then
            echo "ERROR: apkanalyzer was not found in Android SDK command-line tools."
            exit 1
          fi
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Expected ARM64 APK was not generated: $APK"
            exit 1
          fi
          EXPECTED_VERSION_NAME="${PUBSPEC_VERSION%%+*}"
          # This is a single-ABI APK (not a split APK), so versionCode matches pubspec.yaml.
          EXPECTED_VERSION_CODE="${PUBSPEC_VERSION##*+}"
          ACTUAL_NAME="$("$APK_ANALYZER" manifest version-name "$APK")"
          ACTUAL_CODE="$("$APK_ANALYZER" manifest version-code "$APK")"
          echo "$APK -> versionName=$ACTUAL_NAME, versionCode=$ACTUAL_CODE"
          if [[ "$ACTUAL_NAME" != "$EXPECTED_VERSION_NAME" || "$ACTUAL_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "ERROR: APK metadata does not match pubspec.yaml ($EXPECTED_VERSION_NAME / $EXPECTED_VERSION_CODE)."
            exit 1
          fi
          echo "Verified ARM64 APK metadata for $PUBSPEC_VERSION."

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: pcwork-android-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
