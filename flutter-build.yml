name: PCWork iOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle and CocoaPods dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-mobile-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'ios/Podfile', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-
      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.pcworkbg --project-name pcwork_mobile .
      - name: Remove generated placeholder test for MyApp
        run: rm -f test/widget_test.dart
      - name: Validate and export the single app build number
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          PUBSPEC_BUILD="${PUBSPEC_VERSION##*+}"
          DART_BUILD="$(sed -n "s/.*defaultValue: \([0-9][0-9]*\)).*/\1/p" lib/app/pcwork_app.dart | head -n 1)"
          if [[ ! "$PUBSPEC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ || -z "$PUBSPEC_BUILD" || "$PUBSPEC_BUILD" != "$DART_BUILD" ]]; then
            echo "ERROR: pubspec.yaml build number ($PUBSPEC_BUILD) and Dart fallback ($DART_BUILD) do not match."
            exit 1
          fi
          echo "PCWORK_BUILD_NUMBER=$PUBSPEC_BUILD" >> "$GITHUB_ENV"
          echo "Validated app version $PUBSPEC_VERSION"

      # flutter_native_splash is a build-time generator, but Flutter may still
      # include its Android plugin in GeneratedPluginRegistrant when it is kept
      # under dev_dependencies. Keep it as a regular dependency so the plugin
      # implementation is present when javac compiles the generated registrant.
      - name: Ensure native splash plugin is a runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          lines = path.read_text().splitlines(keepends=True)
          dev_start = next((i for i, line in enumerate(lines)
                            if re.match(r"^dev_dependencies:\s*(?:#.*)?$", line.rstrip("\n"))), None)
          dep_start = next((i for i, line in enumerate(lines)
                            if re.match(r"^dependencies:\s*(?:#.*)?$", line.rstrip("\n"))), None)
          if dev_start is None:
              print("dev_dependencies section not found; no relocation needed")
              raise SystemExit(0)
          dev_end = next((i for i in range(dev_start + 1, len(lines))
                          if lines[i].strip() and not lines[i][0].isspace()), len(lines))
          item_index = next((i for i in range(dev_start + 1, dev_end)
                             if re.match(r"^  flutter_native_splash:", lines[i])), None)
          if item_index is None:
              print("flutter_native_splash is not under dev_dependencies")
              raise SystemExit(0)
          item = lines.pop(item_index)
          if dep_start is None:
              # Insert a dependencies section before dev_dependencies.
              lines.insert(dev_start, "dependencies:\n")
              dep_start = dev_start
          dep_end = next((i for i in range(dep_start + 1, len(lines))
                          if lines[i].strip() and not lines[i][0].isspace()), len(lines))
          lines.insert(dep_end, item)
          path.write_text("".join(lines))
          print("Moved flutter_native_splash from dev_dependencies to dependencies")
          PYTHON
          grep -n -B1 -A2 '^  flutter_native_splash:' pubspec.yaml

      - name: Clean generated Flutter state
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -f .flutter-plugins .flutter-plugins-dependencies

      - name: Get dependencies
        run: flutter pub get
      - name: Generate PCWork launcher icons and native splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Analyze Dart code
        run: flutter analyze
      - name: Build unsigned iOS app
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=PCWORK_BUILD_NUMBER="$PCWORK_BUILD_NUMBER"
          --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
          --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY"
          --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID"
          --dart-define=FIREBASE_IOS_BUNDLE_ID="$FIREBASE_IOS_BUNDLE_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: pcwork-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
